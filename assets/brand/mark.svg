<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ec3013"/>
      <stop offset="100%" stop-color="#9e3526"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#fdfcfc"/>

  <!-- Four ascending bars: the month filling up. The tallest is the goal. -->
  <g fill="url(#g)">
    <rect x="250" y="600" width="88" height="180" rx="30"/>
    <rect x="368" y="520" width="88" height="260" rx="30"/>
    <rect x="486" y="428" width="88" height="352" rx="30"/>
  </g>
  <rect x="604" y="300" width="88" height="480" rx="30" fill="#201e1d"/>

  <!-- The arc: the adaptive path, bending over the bars toward the goal. -->
  <path d="M 294 560 Q 420 330 648 262"
        fill="none" stroke="url(#g)" stroke-width="34"
        stroke-linecap="round" opacity="0.55"/>
  <circle cx="648" cy="262" r="34" fill="#ec3013"/>
</svg>
